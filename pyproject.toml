[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transmission-tui"
version = "0.2.0"
description = "A lightweight Textual TUI for monitoring and controlling Transmission"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Florian Maillard" }
]
dependencies = [
  "textual>=1.0",
  "transmission-rpc>=7.0",
]

[dependency-groups]
dev = [
  "mypy>=1.11",
  "ruff>=0.7",
]

[project.scripts]
transmission-tui = "transmission_tui.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/transmission_tui"]


[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
ignore_missing_imports = true
